<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>anotaciones rapidas</title>
    <link rel="stylesheet" href="anotaciones_rapidas.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css">
    <script src="anotaciones_rapidas.js" defer></script>
</head>
<body>
    <!---------------------------------------->
    <!--|estructuracion_anotaciones_rapidas|-->
    <!---------------------------------------->
    <main class="app">
        <header>
            <h1>Anotaciones Rápidas</h1>
            <p class="subtitulo">Escribe una idea, pulsa Agregar y se guarda sola en tu navegador.</p>
        </header>
        <!------------------------------->
        <!--|formulario_de_anotaciones|-->
        <!------------------------------->
        <section class="nueva">
            <label for="campo-nota" class="etiqueta">Nueva anotación</label>
            <div class="fila">
                <input id="campo-nota" type="text" placeholder="Ej: Comprar cuaderno" maxlength="100" autocomplete="off">
                <button id="btn-agregar" class="boton">Agregar</button>
            </div>
            <pid="caracteres" class="caracteres">0 / 100</p>
            <pid="error" class="error oculto">Escribe algo antes de agregar.</p>
        </section>
        <aside class="consejo"><strong>Consejo:</strong> marca la casilla de una nota cuando la termines y usa los filtros para ver solo lo que te falta por hacer.</aside>
        <!---------------------------->
        <!--|control_de_anotaciones|-->
        <!---------------------------->
        <div class="progreso-fondo">
            <div id="progreso" class="progreso"></div>
        </div>
        <section class="barra">
            <p id="contador" class="contador"></p>
            <div class="filtros" role="group" aria-label="Filtrar anotaciones">
                <button class="filtro" data-filtro="todas">Todas</button>
                <button class="filtro" data-filtro="pendientes">Pendientes</button>
                <button class="filtro" data-filtro="hechas">Hechas</button>
            </div>
        </section>
        <ul id="lista" class="lista"></ul>
        <p id="vacio" class="vacio oculto"></p>
        <!------------------------------------------->
        <!--|botones_para_eliminar_las_anotaciones|-->
        <!------------------------------------------->
        <div class="acciones">
            <button id="btn-completadas" class="boton-texto">Borrar las hechas</button>
            <button id="btn-todo" class="boton-texto">Borrar todo</button>
        </div>
    </main>
</body>
</html>
